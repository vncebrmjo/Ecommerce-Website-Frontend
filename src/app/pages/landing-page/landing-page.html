<!-- Navbar - Pure Tailwind CSS -->
<nav class="bg-white shadow-sm">
  <div class="flex items-center justify-between px-4 py-3">
    <!-- Left: Mobile Menu + Logo -->
    <div class="flex items-center gap-2">
      <!-- Mobile Hamburger -->
      <div class="relative lg:hidden">
        <button class="p-2 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
          </svg>
        </button>
      </div>
      
      <!-- Logo -->
      <a href="#" class="text-xl font-bold">Ecommerce Website</a>
    </div>

    <!-- Center: Desktop Search - FIXED: Added flex-1 to center properly -->
    <div class="hidden lg:flex flex-1 justify-center px-8">
      <div class="relative w-full max-w-2xl">
        <input 
          type="text" 
          placeholder="Search products..." 
          class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400">
          <path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>

    <!-- Right: Nav Links + Cart -->
    <div class="flex items-center gap-4">
      <a href="#" class="hidden lg:inline-block px-4 py-2 text-gray-700 hover:text-gray-900 font-medium">Products</a>
      <a href="#" class="hidden lg:inline-block px-4 py-2 text-gray-700 hover:text-gray-900 font-medium">Deals</a>
      
      <!-- Cart Button -->
      <button class="p-2 rounded-full hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Search -->
<div class="lg:hidden px-4 py-3 bg-white border-b border-gray-200">
  <div class="relative">
    <input 
      type="text" 
      placeholder="Search products..." 
      class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
    />
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400">
      <path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd" />
    </svg>
  </div>
</div>

<!-- Categories with Icons -->
<div class="bg-white border-b border-gray-200">
  <div class="overflow-x-auto px-4 py-3">
    <div class="flex gap-2 min-w-max">
      @for (category of categories(); track category.name) {
        <button
          type="button"
          (click)="selectCategory(category.name)"
          [class]="isActive(category.name) 
            ? 'px-4 py-2 bg-gray-900 text-white rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-800 transition-colors flex items-center gap-2' 
            : 'px-4 py-2 text-gray-700 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-100 transition-colors flex items-center gap-2'"
        >
          <span class="text-base">{{ category.icon }}</span>
          <span>{{ category.name }}</span>
        </button>
      }
    </div>
  </div>
</div>
